<mat-card>
  <mat-card-header>
    <h2 mat-card-title>Education</h2>
  </mat-card-header>
  <mat-card-content class="mt-3">
    @for (entry of education; track entry.degree) {
      <section class="entry">
        <h3 class="degree">
          <mat-icon class="degree-icon" aria-hidden="true">school</mat-icon>
          {{ entry.degree }}
        </h3>
        <p class="institution">{{ entry.institution }}</p>
        <p><strong>Focus areas:</strong> {{ entry.focusAreas.join(', ') }}</p>
        <p><strong>Coursework:</strong> {{ entry.coursework }}</p>
      </section>
    }
  </mat-card-content>
</mat-card>
