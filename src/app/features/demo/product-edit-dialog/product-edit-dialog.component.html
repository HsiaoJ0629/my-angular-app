<mat-toolbar>
  <div class="w-100 d-flex align-items-center justify-content-between">
    <h2 class="dialog-title" mat-dialog-title>{{ data.title }}</h2>
    <button mat-icon-button type="button" aria-label="Close dialog" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</mat-toolbar>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="row">
      <mat-form-field class="col-md-12 mb-1" appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" required />
        @if (form.controls.title.hasError('required')) {
          <mat-error>Title is required</mat-error>
        } @else if (form.controls.title.hasError('maxlength')) {
          <mat-error>Title must be 120 characters or fewer</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="col-md-6" appearance="outline">
        <mat-label>Price</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="number" formControlName="price" min="0.01" step="0.01" />
        <mat-error>Price must be greater than 0</mat-error>
      </mat-form-field>

      <mat-form-field class="col-md-6" appearance="outline">
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" min="0" step="1" />
        <mat-error>Stock cannot be negative</mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-flat-button type="submit" [disabled]="isSaving()">
      @if (isSaving()) {
        <mat-spinner class="button-spinner" diameter="18" />
      }
      Save
    </button>
    <button mat-stroked-button type="button" [disabled]="isSaving()" (click)="cancel()">
      Cancel
    </button>
  </mat-dialog-actions>
</form>
